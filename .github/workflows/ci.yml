name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 18
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y clang-format-18
      - name: Check formatting
        run: CLANG_FORMAT=clang-format-18 bash tools/format.sh --check

  tidy:
    name: clang-tidy (report)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y clang-tidy-18
      - name: Configure
        run: cmake -S . -B build/cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Generate the version header
        run: cmake --build build/cmake --target ddr5engine
      - name: Run clang-tidy
        # Findings are listed in the log; .clang-tidy sets WarningsAsErrors to empty, so they do not fail the job.
        run: |
          clang-tidy-18 -p build/cmake --quiet \
            $(ls src/*.cpp | grep -v -e gui_main.cpp -e gui_window.cpp -e gui_text.cpp -e gui_dpi.cpp -e platform_win.cpp -e inject.cpp) \
            2>&1 | tee tidy.log
      - name: Summary
        run: echo "clang-tidy warnings:" "$(grep -c 'warning:' tidy.log || true)"

  linux:
    name: Linux build + unit tests (clang++)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/cmake -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build/cmake --target ddr5test_cli ddr5test_cli_inject unit_tests ddr5gui_logic -j "$(nproc)"
      - name: Unit tests
        run: build/unit_tests

  selftest:
    name: tools/selftest.sh (SAN=${{ matrix.san || 'none' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        san: ['', 'address,undefined', 'thread']
    steps:
      - uses: actions/checkout@v4
      - name: Allow ThreadSanitizer on this kernel
        if: matrix.san == 'thread'
        # TSan needs a lower mmap ASLR entropy than the runner's default.
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Self-test
        env:
          CXX: clang++
          SAN: ${{ matrix.san }}
        run: bash tools/selftest.sh

  windows:
    name: Windows build + unit tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build (GUI, CLI, unit tests; warnings are errors)
        shell: cmd
        env:
          DDR5_WARNINGS_AS_ERRORS: 'ON'
        run: build.bat
      - name: Unit tests
        shell: cmd
        run: build\unit_tests.exe
